<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="wrapper">
			<aside>
				<h1>Add Books</h1>
				<form action="">
					<label for="bookName"> Book Name </label>
					<input type="text" name="bookName" id="bookName" placeholder="Dom Casmurro" />

					<label for="bookAuthor"> Author </label>
					<input
						type="text"
						name="bookAuthor"
						id="bookAuthor"
						placeholder="Machado de Assis"
					/>

					<div class="book-status">
						<label>
							<input type="radio" name="status" value="unread" />
							Unread
						</label>

						<label>
							<input type="radio" name="status" value="reading" />
							Reading
						</label>

						<label>
							<input type="radio" name="status" value="read" />
							Read
						</label>
					</div>

					<button id="btnAddBook" class="btn-add-book">Add</button>
				</form>
			</aside>

			<div class="book-painel"></div>
		</div>
		<script type="module" src="script/main.js"></script>
	</body>
</html>
